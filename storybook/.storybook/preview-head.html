<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
  rel="stylesheet"
/>

<script>
  // REASON: chaque déploiement GitHub Pages remplace tous les assets hashés. Un onglet
  // ouvert avant le déploiement (ou un iframe.html servi depuis le cache, max-age=600)
  // référence des chunks supprimés → "Failed to fetch dynamically imported module".
  // On recharge alors la page entière une seule fois pour récupérer le nouvel index.
  // Garde sessionStorage : pas de boucle de rechargement si le chunk est réellement absent.
  window.addEventListener("vite:preloadError", (event) => {
    const KEY = "comete-sb-preload-reload";
    try {
      const last = Number(sessionStorage.getItem(KEY) || 0);
      if (Date.now() - last < 30000) return;
      sessionStorage.setItem(KEY, String(Date.now()));
    } catch {
      return;
    }
    event.preventDefault();
    (window.top || window).location.reload();
  });
</script>
