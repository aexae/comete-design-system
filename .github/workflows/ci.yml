name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:
  ci:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile
        env:
          NPM_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Intégrité du paquet publié : valide la config d'exports/fichiers.
      # (Le build lance déjà `scripts/smoke-dist.mjs` qui garantit des CSS Modules
      #  fonctionnels dans dist — garde contre la régression « dist non stylé ».)
      - name: Package integrity (publint)
        run: pnpm dlx publint

      - name: Install Storybook dependencies
        working-directory: storybook
        run: pnpm install --frozen-lockfile
        env:
          NPM_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint Storybook
        working-directory: storybook
        run: pnpm lint

      - name: Typecheck Storybook
        working-directory: storybook
        run: pnpm typecheck

      # Tests d'interaction : les stories (play functions + a11y) sont exécutées
      # en navigateur headless via @storybook/addon-vitest (@vitest/browser +
      # Playwright/Chromium). Nécessite le binaire Chromium.
      - name: Install Playwright Chromium
        working-directory: storybook
        run: pnpm exec playwright install --with-deps chromium

      - name: Test Storybook stories
        working-directory: storybook
        run: pnpm test
